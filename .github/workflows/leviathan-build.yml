name: Build Leviathan
on:
  workflow_dispatch:
  push:
    paths:
      - 'leviathan-abisal/**'
      - '.github/workflows/leviathan-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leviathan-abisal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check exported resources
        run: |
          for f in geo/boss.geo.json geo/full.geo.json animations/boss.animation.json animations/full.animation.json textures/entity/boss.png textures/entity/full.png; do
            test -s "src/main/resources/assets/leviathan_abisal/$f" || { echo "Missing asset: $f"; exit 1; }
          done
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-alpha
          path: leviathan-abisal/build/libs/*.jar
