plugins { id 'fabric-loom' version '1.8.13' }
version = '0.1.0-alpha'
group = 'zxk.leviathan'
repositories { mavenCentral(); maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }; maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.1+1.21.1'
 modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.6'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
